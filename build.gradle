plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    maven {
        url 'https://build.shibboleth.net/maven/releases/'
        allowInsecureProtocol true
    }
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation enforcedPlatform("${quarkusPlatformGroupId}:quarkus-cxf-bom:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-resteasy-reactive-jackson'
    implementation 'io.quarkus:quarkus-resteasy-reactive'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkiverse.cxf:quarkus-cxf'
    implementation 'io.quarkiverse.cxf:quarkus-cxf-rt-features-metrics'
    implementation 'io.quarkiverse.cxf:quarkus-cxf-rt-ws-security'
    implementation 'io.quarkiverse.cxf:quarkus-cxf-rt-features-logging'
    implementation 'io.quarkiverse.cxf:quarkus-cxf-xjc-plugins'
    implementation 'io.quarkiverse.cxf:quarkus-cxf-rt-transports-http-hc5'
    implementation 'org.apache.commons:commons-lang3:3.13.0'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'

}

group 'org.keycube'
version '1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:all'
}

compileTestJava {
    options.encoding = 'UTF-8'
}